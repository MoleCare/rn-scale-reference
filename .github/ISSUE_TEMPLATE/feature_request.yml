name: Feature request
description: An idea that would make the package more useful.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This package estimates sizes and never presents an estimate as a clinical
        measurement (see CONTRIBUTING.md). Ideas that label a size as worrying,
        or hide the error in an estimate, will be declined. Better tilt handling,
        uncertainty estimates and clearer messages are very welcome.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that is hard today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you would like it to work, ideally with the options or API you imagine.
  - type: checkboxes
    id: help
    attributes:
      label: Can you help?
      options:
        - label: I would like to open a pull request for this.
